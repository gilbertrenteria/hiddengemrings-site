  function shrink(file, cb) { var u = URL.createObjectURL(file), im = new Image(); im.onload = function () { var mx = 1100, sc = Math.min(1, mx / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * sc); c.height = Math.round(im.naturalHeight * sc); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); cb(c.toDataURL('image/jpeg', 0.82)); URL.revokeObjectURL(u); }; im.src = u; }
  function sendInspo(b) { if (PREVIEW) { toast('Preview mode, not saved'); return; } b.inspo = true; toast('Adding...'); post('/portal/' + T + '/msg', b).then(function (j) { if (!j.ok) { toast(j.error || 'Could not add that'); return; } P.inspo = j.portal.inspo; var th = document.getElementById('thumbs'); if (th) th.innerHTML = inspoThumbs(); toast('Added. ' + P.rep + ' can see it now.'); }).catch(function () { toast('Could not add that. Try again.'); }); }

      ms.map(function (m) { return '<div class="m ' + (m.from === 'customer' ? 'c' : 't') + '">' + E(m.text) + (m.img ? '<img src="' + API + m.img + '" alt="">' : '') + '<small>' + (m.from === 'customer' ? 'You' : E(m.name)) + ' · ' + new Date(m.at).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + '</small></div>'; }).join('');
    th.scrollTop = th.scrollHeight;
  }
  function openChat() { chat.classList.add('on'); drawThread(); seenMsgs = (P.msgs || []).length; try { localStorage.setItem('hgp_seen_' + T, seenMsgs); } catch (e) {} document.getElementById('chatDot').hidden = true; }
  document.getElementById('chatBtn').onclick = function () { chat.classList.contains('on') ? chat.classList.remove('on') : openChat(); };
  document.getElementById('chatX').onclick = function () { chat.classList.remove('on'); };
  function sendMsg(body) { if (PREVIEW) { toast('Preview mode, not sent'); return; } post('/portal/' + T + '/msg', body).then(function (j) { if (!j.ok) { toast(j.error || 'Could not send'); return; } P.msgs = j.portal.msgs; drawThread(); }).catch(function () { toast('Could not send. Try again.'); }); }
  document.getElementById('chatSend').onclick = function () { var t = document.getElementById('chatText'); if (!t.value.trim()) return; sendMsg({ text: t.value.trim() }); t.value = ''; };
  document.getElementById('chatFile').onchange = function (e) { var f = e.target.files[0]; if (f) shrink(f, function (d) { sendMsg({ image: d, text: '' }); }); };
  function poll() { fetch(API + '/portal/' + T).then(function (r) { return r.json(); }).then(function (j) { if (!j.ok) return; var n = (j.portal.msgs || []).length; if (n !== (P.msgs || []).length) { P.msgs = j.portal.msgs; if (chat.classList.contains('on')) drawThread(); else unread(); } }).catch(function () {}); }
  function unread() { var seen = 0; try { seen = Number(localStorage.getItem('hgp_seen_' + T) || 0); } catch (e) {} var teamNew = (P.msgs || []).slice(seen).some(function (m) { return m.from === 'team'; }); document.getElementById('chatDot').hidden = !teamNew; }

  function centerImgs(root) {
    root.querySelectorAll('img.ctr').forEach(function (img) {
      var src0 = img.getAttribute('data-src0') || img.currentSrc || img.src;
      if (!src0 || /^data:/.test(src0)) return;
      img.setAttribute('data-src0', src0);
      if (centerCache[src0]) { img.src = centerCache[src0]; return; }
      img.style.opacity = '0';
      fetch(src0, { mode: 'cors' }).then(function (r) { if (!r.ok) throw 0; return r.blob(); }).then(function (b) { return createImageBitmap(b); }).then(function (bm0) {
        // erase the small watermark in the bottom right so it never shows in a crop
        var bm = document.createElement('canvas'); bm.width = bm0.width; bm.height = bm0.height;
        var fx = bm.getContext('2d'); fx.drawImage(bm0, 0, 0);
        var x0 = Math.round(bm.width * 0.8), y0 = Math.round(bm.height * 0.6), rw = bm.width - x0, rh = bm.height - y0;
        var reg = fx.getImageData(x0 - 4, y0, rw + 4, rh), rd = reg.data, RW = rw + 4;
        for (var ry = 0; ry < rh; ry++) {
          var ri = (ry * RW) * 4, R = rd[ri], G = rd[ri + 1], B = rd[ri + 2];
          for (var rx = 4; rx < RW; rx++) { var q = (ry * RW + rx) * 4;
            if (Math.max(Math.abs(rd[q] - R), Math.abs(rd[q + 1] - G), Math.abs(rd[q + 2] - B)) > 12) { rd[q] = R; rd[q + 1] = G; rd[q + 2] = B; }
            else { R = rd[q]; G = rd[q + 1]; B = rd[q + 2]; } }
        }
        fx.putImageData(reg, x0 - 4, y0);
        var sc = Math.min(1, 400 / Math.max(bm.width, bm.height));
        var W = Math.round(bm.width * sc), H = Math.round(bm.height * sc);
        var c = document.createElement('canvas'); c.width = W; c.height = H;
        var x = c.getContext('2d'); x.drawImage(bm, 0, 0, W, H);
        var d = x.getImageData(0, 0, W, H).data;
        // background color from the top edge and the upper side edges
        var br = 0, bgc = 0, bb = 0, bn = 0;
        function addPx(px, py) { var j = (py * W + px) * 4; br += d[j]; bgc += d[j + 1]; bb += d[j + 2]; bn++; }
        for (var px = 0; px < W; px += 2) { addPx(px, 1); addPx(px, 3); }
        for (var py = 0; py < H * 0.6; py += 2) { addPx(1, py); addPx(W - 2, py); }
        br /= bn; bgc /= bn; bb /= bn;
        var cols = new Array(W).fill(0), rows = new Array(H).fill(0), m = Math.max(2, Math.round(W * 0.012));
        // background can glow or fade across the photo, so compare each pixel with its own row's

        function edge(y, x1) { var r = 0, g = 0, b = 0; for (var k = 0; k < 4; k++) { var j = (y * W + x1 + k) * 4; r += d[j]; g += d[j + 1]; b += d[j + 2]; } return [r / 4, g / 4, b / 4]; }
        for (var y = m; y < H - m; y++) {
          var Lc = edge(y, m), Rc = edge(y, W - m - 4);
          for (var xx = m; xx < W - m; xx++) {
            if (xx > W * 0.76 && y > H * 0.6) continue; // logo corner
            var t = xx / W, i = (y * W + xx) * 4;
            var diff = Math.max(Math.abs(d[i] - (Lc[0] + (Rc[0] - Lc[0]) * t)), Math.abs(d[i + 1] - (Lc[1] + (Rc[1] - Lc[1]) * t)), Math.abs(d[i + 2] - (Lc[2] + (Rc[2] - Lc[2]) * t)));

        function span(arr, need) { var lo = -1, hi = -1; for (var k = 0; k < arr.length; k++) if (arr[k] > need) { if (lo < 0) lo = k; hi = k; } return [lo, hi]; }
        var sx = span(cols, Math.max(2, H * 0.012)), sy = span(rows, Math.max(2, W * 0.012));

        var cx = (sx[0] + sx[1]) / 2 / sc, cy = (sy[0] + sy[1]) / 2 / sc;

        side = Math.min(side, Math.max(bm.width, bm.height) * 1.1);

  }
