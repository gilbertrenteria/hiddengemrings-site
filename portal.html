<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Hidden Gem</title>
<meta property="og:title" content="Hidden Gem">
<meta property="og:description" content="Something special is waiting for you.">
<meta name="theme-color" content="#F6F3EC">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#F6F3EC;--cream-alt:#EEEBE2;--line:rgba(92,77,64,.16);--taupe:#A0948A;--taupe-dark:#776C5C;--brown:#54453A;--brown-dark:#3A2F26;--ink:#453E37;--gold:#B99C5F;--goldsoft:#F3ECDD;--white:#fff}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:400 16px/1.6 'Work Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{font-family:'Newsreader',serif;font-weight:500;color:var(--brown-dark);margin:0;line-height:1.1;text-wrap:balance}
button{font:inherit;color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;max-width:1080px;margin:0 auto;padding:16px 20px 10px}
.top img{height:38px;display:block}
.talkbtn{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:9px 15px;font:600 12px 'Work Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--brown-dark);cursor:pointer}
.talkbtn i{width:8px;height:8px;border-radius:50%;background:#c9bfb3}
.talkbtn i.on{background:#3fa05a;box-shadow:0 0 0 3px rgba(63,160,90,.18)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 120px}
.wrap.wide{max-width:1080px}
.card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:24px 24px 30px;box-shadow:0 18px 50px rgba(66,53,41,.10);position:relative;overflow:hidden}
.head{display:flex;justify-content:space-between;align-items:center}
.back{background:none;border:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--taupe-dark);cursor:pointer;padding:6px 0;visibility:hidden}
.back.show{visibility:visible}
.count{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe-dark)}
.bar{height:4px;background:var(--cream-alt);border-radius:99px;margin:10px 0 22px;overflow:hidden}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--brown));border-radius:99px;transition:width .5s ease}
.kick{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:0 0 10px}
.big{font-size:clamp(30px,7vw,46px);line-height:1.06;letter-spacing:-.01em}
.big em{font-style:italic;color:var(--gold)}
.lead{color:#6B5B4C;font-size:17px;line-height:1.65;margin:14px 0 0}
.pg{animation:pgIn .7s ease both}
@keyframes pgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hero{border-radius:20px;overflow:hidden;aspect-ratio:4/5;background:linear-gradient(160deg,#f3ead8,#e6d9bf);margin:0 0 22px;max-height:56vh}
.hero img{width:100%;height:100%;object-fit:cover;display:block;animation:slowZoom 14s ease-out both}
@keyframes slowZoom{from{transform:scale(1.06)}to{transform:scale(1)}}
.story{display:grid;gap:0}
@media(min-width:860px){.wrap.story-w{max-width:1000px}.story{grid-template-columns:1fr 1fr;gap:40px;align-items:center}.story .hero{margin:0;max-height:none}}
.said{list-style:none;padding:0;margin:18px 0 0}
.said li{font-family:'Newsreader',serif;font-style:italic;font-size:21px;color:var(--brown-dark);padding:8px 0;border-bottom:1px solid var(--line)}
.said li:last-child{border:0}
.craft{display:grid;gap:10px;margin-top:18px}
.craft div{display:flex;gap:12px;align-items:flex-start;font-size:15px;color:#5d5045}
.craft b{font-family:'Newsreader',serif;font-size:22px;color:var(--gold);font-weight:500;line-height:1;min-width:26px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;border:0;border-radius:999px;padding:17px 22px;font:600 14px 'Work Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;background:linear-gradient(135deg,var(--brown),var(--brown-dark));color:#fff;box-shadow:0 10px 24px rgba(33,26,20,.22);transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn.gold{background:linear-gradient(135deg,#c9ad70,var(--gold));color:#fff}
.btn.ghost{background:#fff;color:var(--brown-dark);border:1.5px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.45}
.mt{margin-top:22px}.mt2{margin-top:12px}
.link{background:none;border:0;color:var(--taupe-dark);text-decoration:underline;cursor:pointer;font-size:14px;padding:10px;display:block;margin:6px auto 0}
.skip{position:absolute;top:22px;right:24px}
/* rings */
.rhead{text-align:center;max-width:640px;margin:0 auto 26px}
.rings{display:grid;gap:22px;grid-template-columns:1fr}
@media(min-width:700px){.rings{grid-template-columns:1fr 1fr}}
@media(min-width:1040px){.rings{grid-template-columns:1fr 1fr 1fr}}
.ring{background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 12px 34px rgba(66,53,41,.08);display:flex;flex-direction:column;opacity:0;transform:translateY(18px);transition:opacity .8s ease,transform .8s ease,box-shadow .2s,border-color .2s}
.ring.in{opacity:1;transform:none}
.ring.saved{border-color:var(--gold);box-shadow:0 0 0 3px rgba(185,156,95,.35),0 12px 34px rgba(66,53,41,.08)}
.ring .ph{aspect-ratio:1;background:#2e2722;display:flex;align-items:center;justify-content:center;position:relative}
.ring .ph img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.ring .num{position:absolute;top:14px;left:14px;background:rgba(255,255,255,.92);border-radius:999px;padding:5px 11px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--brown-dark)}
.ring .body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:6px;flex:1}
.ring h3{font-size:24px}
.ring .meta{font-size:14px;color:var(--taupe-dark);letter-spacing:.02em}
.specs{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;background:var(--cream);border-radius:14px;padding:12px 14px;margin-top:6px;font-size:13.5px;line-height:1.35}
.specs dt{color:var(--taupe-dark);letter-spacing:.06em;text-transform:uppercase;font-size:11px;font-weight:600;padding-top:2px}
.specs dd{margin:0;color:var(--brown-dark);font-weight:500}
.specs .sw{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.size{display:flex;align-items:center;gap:12px;background:var(--cream);border-radius:14px;padding:8px 12px;margin-top:6px}
.size svg{flex:none}
.size small{font-size:12.5px;color:#6B5B4C;line-height:1.35}
.acts{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:auto;padding-top:12px}
.acts .btn{padding:14px 14px;font-size:12.5px}
.save{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:0 16px;cursor:pointer;font:600 12.5px 'Work Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--brown-dark);white-space:nowrap}
.save.on{background:var(--goldsoft);border-color:var(--gold)}
.dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translate(-50%,140%);transition:transform .35s ease;z-index:30;width:min(560px,calc(100% - 24px));background:var(--brown-dark);color:#fff;border-radius:999px;padding:8px 8px 8px 20px;display:flex;align-items:center;gap:10px;box-shadow:0 14px 36px rgba(0,0,0,.25)}
.dock{visibility:hidden}.dock.show{transform:translate(-50%,0);visibility:visible}
.dock span{flex:1;font-size:14px}
.dock button{background:#fff;color:var(--brown-dark);border:0;border-radius:999px;padding:11px 18px;font:700 12px 'Work Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.notq{max-width:720px;margin:40px auto 0;background:#fff;border:1px solid var(--line);border-radius:26px;padding:26px 22px;box-shadow:0 12px 34px rgba(66,53,41,.08);text-align:center}
.notq h2{font-size:clamp(26px,5vw,34px)}
.notq h2 em{font-style:italic;color:var(--gold)}
.notq p{color:#6B5B4C;margin:8px 0 0}
.nopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;text-align:left}
@media(min-width:700px){.nopts{grid-template-columns:1fr 1fr 1fr}}
.nopt{display:flex;align-items:center;gap:10px;background:var(--cream);border:1.5px solid rgba(92,77,64,.16);border-radius:16px;padding:13px 12px;cursor:pointer;font-size:14.5px;font-weight:500;color:var(--brown-dark);min-height:58px;transition:all .2s}
.nopt svg{flex:none;width:26px;height:26px;stroke:var(--gold);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nopt.sel{background:linear-gradient(135deg,var(--brown),var(--brown-dark));color:#fff;border-color:transparent}
.nopt.sel svg{stroke:#e9d7a8}
.none{text-align:center;margin:34px auto 0;max-width:520px}
.none button{background:none;border:0;font-family:'Newsreader',serif;font-style:italic;font-size:20px;color:var(--brown-dark);text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:5px;cursor:pointer}
/* chips like /start */
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.chips.one{grid-template-columns:1fr}
.chips button{font-size:15px;font-weight:500;color:var(--brown-dark);background:var(--cream);border:1.5px solid rgba(92,77,64,.18);border-radius:16px;padding:14px 10px;cursor:pointer;min-height:54px;transition:all .2s}
.chips button.sel{background:linear-gradient(135deg,var(--brown),var(--brown-dark));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(33,26,20,.25)}
label.fl{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe-dark);margin:18px 0 6px;font-weight:600}
select,textarea{width:100%;font:16px 'Work Sans',sans-serif;color:var(--brown-dark);background:var(--cream);border:1.5px solid rgba(92,77,64,.18);border-radius:14px;padding:14px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--taupe-dark) 50%),linear-gradient(135deg,var(--taupe-dark) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
textarea{min-height:96px;resize:vertical}
.pickimg{border-radius:20px;overflow:hidden;background:#2e2722;aspect-ratio:1;max-width:420px;margin:18px auto 0}
.pickimg img{width:100%;height:100%;object-fit:cover;display:block}
.favs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px}
.fav{border:1.5px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;cursor:pointer;text-align:left;padding:0}
.fav img{width:100%;aspect-ratio:1;object-fit:cover;background:#2e2722;display:block}
.fav div{padding:10px 12px;font-size:13px;color:var(--brown-dark)}
.fav b{display:block;font-family:'Newsreader',serif;font-size:18px;font-weight:500}
.center{text-align:center}
/* talk card */
.talk{background:var(--goldsoft);border:1px solid rgba(185,156,95,.35);border-radius:22px;padding:20px;margin-top:24px;text-align:left}
.talk h3{font-size:22px}
.talk p{margin:4px 0 12px;color:#6B5B4C;font-size:14.5px}
.talk .opts{display:grid;gap:10px}
.talk .opt{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;text-align:left}
.talk .opt b{display:block;font-weight:600;color:var(--brown-dark)}
.talk .opt small{display:block;color:var(--taupe-dark);font-size:13px}
.talk .opt .ic{width:36px;height:36px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;flex:none}
.talk .opt.now{border-color:#3fa05a}
.talk .opt.now .ic{background:#e7f4ea}
.sub{margin-top:12px}
.note{font-size:13px;color:var(--taupe-dark);text-align:center;margin-top:10px}
.done{background:#fff;border-radius:16px;padding:14px 16px;border:1.5px solid #3fa05a;color:var(--brown-dark);font-size:15px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(30,24,19,.45)}
.sheet.on{display:flex}
.sheet .in{background:var(--cream);width:min(560px,100%);max-height:88vh;overflow:auto;border-radius:26px 26px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet{align-items:center}.sheet .in{border-radius:26px}}
.x{float:right;background:#fff;border:1px solid var(--line);border-radius:999px;width:36px;height:36px;cursor:pointer}
.thread{display:grid;gap:8px;margin:14px 0;max-height:46vh;overflow:auto}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;background:#fff;border:1px solid var(--line);font-size:15px}
.msg.me{margin-left:auto;background:var(--brown);color:#fff;border:0}
.msg img{max-width:100%;border-radius:10px;display:block}
.msg small{display:block;opacity:.7;font-size:11px;margin-top:3px}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-300%);background:var(--brown-dark);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;z-index:60;transition:transform .3s}
.toast.on{transform:translate(-50%,0)}
.foot{text-align:center;font-size:13px;color:var(--taupe-dark);margin-top:40px}
.foot a{color:var(--taupe-dark)}
@media(max-width:520px){.hero{max-height:44vh}.card{padding:20px 18px 26px;border-radius:22px}.lead{font-size:16px}.said li{font-size:19px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ring{opacity:1;transform:none}}
</style>
</head>

  var centerCache = {};
  // Puts every ring dead center: finds the ring against its background, then
  // redraws the photo as a square with the ring centered at the same size in every card.

    ['stoneType', 'Stone type', ['Lab grown diamond (same sparkle, smarter price)', 'Natural diamond', 'Moissanite', 'Not sure, help me choose']],
    ['style', 'Her style', ['Classic', 'Modern', 'Vintage', 'Minimal', 'Glam', 'Boho']]
  ];
  function noneStep(s) {
    view = 'none'; hideDock(); K.mode = 'none'; save();
    app.className = 'wrap';
    var head = '<div class="card pg"><div class="head"><button class="back show" id="bk">&lsaquo; Back</button><span class="count">' + (s + 1) + ' of 3</span></div><div class="bar"><span style="width:' + ((s + 1) * 33) + '%"></span></div>';
    if (s === 0) {
      app.innerHTML = head + '<div class="center"><p class="kick">Let\'s get it right</p><h1 class="big">What felt <em>a little off?</em></h1><p class="lead">Pick all that fit. This helps us create exactly what you see in your mind.</p></div>' +
        '<div class="nopts">' + NOPTS.map(function (o) { var lab = o[1].replace('her style', you() ? 'my style' : 'her style'); return '<button type="button" class="nopt wy' + (K.why.indexOf(o[0]) > -1 ? ' sel' : '') + '" data-w="' + E(o[0]) + '"><svg viewBox="0 0 26 26" aria-hidden="true">' + o[2] + '</svg>' + E(lab) + '</button>'; }).join('') + '</div>' +
        '<button class="btn mt" id="nx">Continue</button></div>' + foot();
      app.querySelectorAll('.wy').forEach(function (b) { b.onclick = function () { var w = b.dataset.w, i = K.why.indexOf(w); if (i > -1) K.why.splice(i, 1); else K.why.push(w); b.classList.toggle('sel'); save(); }; });
      $('bk').onclick = rings; $('nx').onclick = function () { noneStep(1); };
    } else if (s === 1) {
      var pre = P.prefill || {};
      app.innerHTML = head + '<div class="center"><p class="kick">Your ring, your way</p><h1 class="big">Let\'s build it <em>together.</em></h1><p class="lead">No jewelry knowledge needed. Pick what feels right and skip anything you are unsure about.</p></div>' +
        BUILD.map(function (b) {
          var cur = K.build[b[0]] || '', lab = b[0] === 'style' && you() ? 'My style' : b[1];
          return '<label class="fl" for="b_' + b[0] + '">' + E(lab) + '</label><select id="b_' + b[0] + '" data-k="' + b[0] + '"><option value="">' + (pre[b[0]] ? 'Keep ' + E(pre[b[0]]) : 'Choose one') + '</option>' + b[2].map(function (o) { return '<option' + (cur === o ? ' selected' : '') + '>' + E(o) + '</option>'; }).join('') + '</select>';
        }).join('') + '<button class="btn mt" id="nx">Continue</button></div>' + foot();
      app.querySelectorAll('select').forEach(function (el) { el.onchange = function () { if (el.value) K.build[el.dataset.k] = el.value; else delete K.build[el.dataset.k]; save(); }; });
      $('bk').onclick = function () { noneStep(0); }; $('nx').onclick = function () { noneStep(2); };
    } else {
      app.innerHTML = head + '<div class="center"><p class="kick">Last touch</p><h1 class="big">Anything else <em>we should know?</em></h1><p class="lead">A story, a detail ' + she() + ' loves, a ring you saw once. All optional.</p></div>' +
        '<label class="fl" for="notes">Your notes (optional)</label><textarea id="notes" placeholder="For example: she always wears gold and loves simple things">' + E(K.notes) + '</textarea>' +
        '<button class="btn gold mt" id="send">Send my ideas</button><p class="note">No payment and no commitment. New designs arrive within 24 hours.</p></div>' + foot();
      $('notes').oninput = function () { K.notes = this.value; save(); };
      $('bk').onclick = function () { noneStep(1); };
      $('send').onclick = function () { send({ mode: 'none', why: K.why, build: K.build }); };
    }
    window.scrollTo(0, 0);
  }

  /* ---------- send, with retries and a resend on reopen ---------- */
  function send(body) {
    body.notes = view === 'none' ? (($('notes') || {}).value || '') : notesVal();
    K.notes = ($('notes') || {}).value || K.notes;
    var b = $('send'); if (b) { b.disabled = true; b.textContent = 'Sending...'; }
    K.pending = body; save();
    if (PREVIEW) { K.pending = null; sent = true; save(); return sentPage(body.mode); }
    post('/portal/' + T + '/pick', body).then(function (j) {
      if (j.ok || j.saved) { K.pending = j.ok ? null : body; sent = true; save(); sentPage(body.mode); }
      else { if (b) { b.disabled = false; b.textContent = 'Try again'; } toast(j.error || 'Could not send. Try again.'); }
    }).catch(function () { if (b) { b.disabled = false; b.textContent = 'Try again'; } toast('No connection. We saved it and will send it when you are back.'); });
  }
  function sentPage(mode) {
    view = 'sent'; hideDock();
    app.className = 'wrap';
    var r = mode === 'one' ? R(K.ring) : null;
    app.innerHTML = '<div class="card pg center"><p class="kick">' + (mode === 'none' ? 'Received' : 'It is happening') + '</p>' +
      '<h1 class="big">' + (mode === 'none' ? 'We are creating <em>new designs.</em>' : mode === 'favs' ? 'Your favorites are <em>on the bench.</em>' : 'Your ring is <em>coming to life.</em>') + '</h1>' +
      (r && img(r) ? '<div class="pickimg" style="max-width:300px">' + '<img src="' + E(img(r)) + '" alt=""></div>' : '') +
      '<p class="lead">' + (mode === 'none' ? 'We read every word. Fresh designs made just for you arrive within 24 hours.' : 'Your full custom mockup arrives within 24 hours. We will text you the moment it is ready.') + '</p>' +
      talkCard('sent') + '<button class="link" id="again">See all rings again</button></div>' + foot();
    centerRings();
    window.scrollTo(0, 0);
    $('again').onclick = function () { rings(); };
    bindTalk();
  }

  /* ---------- talk with us: text, schedule, talk now ---------- */
  function talkCard(where) {
    var h = where === 'sent' ? 'Want to talk it through now?' : where === 'wait' ? 'Questions while you wait?' : 'Talk with your ring specialist';
    var last = P.contact;
    var doneNow = last && last.type === 'now' && Date.now() - last.at < 3 * 3600e3;
    var doneSch = last && last.type === 'schedule';
    return '<div class="talk"><h3>' + h + '</h3><p>Real people, no pressure. Pick what is easiest for you.</p><div class="opts">' +
      (doneNow ? '<div class="done">&#10003; We will call you within 30 to 45 minutes. Keep your phone close.</div>' :
        (P.online ? '<button class="opt now" data-t="now"><span class="ic">&#9742;</span><span><b>Talk now</b><small>We are online. We will call you within 30 to 45 minutes.</small></span></button>' : '')) +
      '<button class="opt" data-t="text"><span class="ic">&#9993;</span><span><b>Text us</b><small>The easiest way. We reply fast.</small></span></button>' +
      (doneSch ? '<div class="done">&#10003; Call set for ' + E(last.day + ' ' + last.window) + '. We will call you then.</div>' :
        '<button class="opt" data-t="schedule"><span class="ic">&#128197;</span><span><b>Schedule a call</b><small>Pick a day and time that works for you.</small></span></button>') +
      '<button class="opt" data-t="msg"><span class="ic">&#128172;</span><span><b>Message us here</b><small>Send a note or a photo of a ring you love.</small></span></button>' +
      '</div></div>';
  }
  function bindTalk() {
    app.querySelectorAll('.talk .opt').forEach(function (b) { b.onclick = function () { talkAction(b.dataset.t); }; });
  }
  function talkAction(t) {
    if (t === 'text') {
      var body = 'Hi this is ' + (first() || 'me') + '. I am looking at my rings now.';
      if (!PREVIEW) post('/portal/' + T + '/contact', { type: 'text' }).catch(function () {});
      location.href = 'sms:+1' + PHONE + (/iPhone|iPad|Mac/i.test(navigator.userAgent) ? '&' : '?') + 'body=' + encodeURIComponent(body);
      return;
    }
    if (t === 'msg') return chat();
    if (t === 'now') return nowSheet();
    if (t === 'schedule') return schedSheet();
  }
  function sheet(html) { $('sheetIn').innerHTML = '<button class="x" id="sx" aria-label="Close">&times;</button>' + html; $('sheet').classList.add('on'); $('sx').onclick = closeSheet; }
  function closeSheet() { $('sheet').classList.remove('on'); }
  $('sheet').addEventListener('click', function (e) { if (e.target === $('sheet')) closeSheet(); });
  $('talkTop').onclick = function () { sheet('<div style="clear:both"></div>' + talkCard('top')); $('sheetIn').querySelectorAll('.talk .opt').forEach(function (b) { b.onclick = function () { closeSheet(); talkAction(b.dataset.t); }; }); };

  function nowSheet() {
    sheet('<h2 style="font-size:28px;margin-top:6px">Talk now</h2><p class="lead" style="font-size:16px">We will call you at the number you gave us within <b>30 to 45 minutes</b>, so we can have your rings ready in front of us.</p><button class="btn mt" id="yes">Yes, call me</button><button class="link" id="no">Not now</button>');
    $('no').onclick = closeSheet;
    $('yes').onclick = function () {
      this.disabled = true; this.textContent = 'Sending...';
      var done = function () { P.contact = { type: 'now', at: Date.now() }; closeSheet(); toast('Got it. We will call you within 30 to 45 minutes.'); rerender(); };
      if (PREVIEW) return done();
      post('/portal/' + T + '/contact', { type: 'now' }).then(function (j) { if (j.ok) done(); else { closeSheet(); P.online = false; toast(j.error || 'We just stepped away. Pick a time instead.'); rerender(); } }).catch(function () { closeSheet(); toast('No connection. Try again.'); });
    };
  }
  var WINDOWS = [['Morning', 9, 12], ['Afternoon', 12, 17], ['Evening', 17, 21]];
  function schedSheet() {
    var tz = ''; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
    var days = [], d = new Date();
    for (var i = 0; days.length < 6 && i < 10; i++) { var x = new Date(d.getTime() + i * 864e5); if (x.getDay() === 0) continue; days.push(x); }
    var pickDay = null, pickWin = null;
    function lbl(x, i) { return i === 0 && x.toDateString() === d.toDateString() ? 'Today' : x.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); }
    function localRange(w, day) {
      // our hours are Central; show them in the customer's own time
      try {
        var mk = function (h) { var s = day.toLocaleDateString('en-CA', { timeZone: 'America/Chicago' }) + 'T' + String(h).padStart(2, '0') + ':00:00'; var guess = new Date(s + 'Z'); var off = new Date(guess.toLocaleString('en-US', { timeZone: 'America/Chicago' })) - new Date(guess.toLocaleString('en-US', { timeZone: 'UTC' })); return new Date(guess.getTime() - off); };
        var f = function (t) { return t.toLocaleTimeString('en-US', { hour: 'numeric' }).replace(':00', '').toLowerCase(); };
        return f(mk(w[1])) + ' to ' + f(mk(w[2]));
      } catch (e) { return w[1] + ' to ' + w[2]; }
    }
    function draw() {
      sheet('<h2 style="font-size:28px;margin-top:6px">Schedule a call</h2><p style="color:#6B5B4C;margin:4px 0 0">Pick a day and a time. Times are shown in your time zone.</p>' +
        '<label class="fl">Day</label><div class="chips">' + days.map(function (x, i) { return '<button type="button" class="dy' + (pickDay === i ? ' sel' : '') + '" data-i="' + i + '">' + lbl(x, i) + '</button>'; }).join('') + '</div>' +
        '<label class="fl">Time</label><div class="chips one">' + WINDOWS.map(function (w, i) { return '<button type="button" class="wn' + (pickWin === i ? ' sel' : '') + '" data-i="' + i + '">' + w[0] + (pickDay != null ? ' · ' + localRange(w, days[pickDay]) : '') + '</button>'; }).join('') + '</div>' +
        '<button class="btn mt" id="book"' + (pickDay == null || pickWin == null ? ' disabled' : '') + '>Book my call</button>');
      $('sheetIn').querySelectorAll('.dy').forEach(function (b) { b.onclick = function () { pickDay = +b.dataset.i; draw(); }; });
      $('sheetIn').querySelectorAll('.wn').forEach(function (b) { b.onclick = function () { pickWin = +b.dataset.i; draw(); }; });
      $('book').onclick = function () {
        var day = lbl(days[pickDay], pickDay), w = WINDOWS[pickWin], win = w[0].toLowerCase() + ' (' + localRange(w, days[pickDay]) + ')';
        var central = days[pickDay].toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) + ' ' + w[0].toLowerCase() + ' ' + (w[1] > 12 ? w[1] - 12 : w[1]) + (w[1] >= 12 ? 'pm' : 'am') + ' to ' + (w[2] > 12 ? w[2] - 12 : w[2]) + 'pm';
        this.disabled = true; this.textContent = 'Booking...';
        var done = function () { P.contact = { type: 'schedule', at: Date.now(), day: day, window: win }; closeSheet(); toast('You are set. We will call you ' + day.toLowerCase() + '.'); rerender(); };
        if (PREVIEW) return done();
        post('/portal/' + T + '/contact', { type: 'schedule', day: day, window: win, tz: tz, central: central }).then(function (j) { if (j.ok) done(); else toast('Could not book. Try again.'); }).catch(function () { toast('No connection. Try again.'); });
      };
    }
    draw();
  }
  function rerender() { if (view === 'rings') rings(); else if (view === 'sent') sentPage(K.mode); else if (view === 'intro') intro(ii); }

  /* ---------- messages ---------- */
  function chat() {
    function thread() { return (P.msgs || []).map(function (m) { return '<div class="msg' + (m.from === 'customer' ? ' me' : '') + '">' + (m.img ? '<img src="' + API + m.img + '" alt="">' : '') + (m.text ? E(m.text) : '') + '<small>' + (m.from === 'customer' ? 'You' : 'Hidden Gem') + '</small></div>'; }).join('') || '<p style="color:#776C5C">Hi' + (first() ? ' ' + E(first()) : '') + '! Ask us anything or share a ring you love. We reply right here and by text.</p>'; }
    sheet('<h2 style="font-size:28px;margin-top:6px">Message us</h2><div class="thread" id="th">' + thread() + '</div><textarea id="mt" placeholder="Type a message"></textarea><div style="display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:10px"><button class="btn" id="ms">Send</button><label class="btn ghost" style="width:auto;padding:0 18px;cursor:pointer">Photo<input type="file" id="mf" accept="image/*" hidden></label></div>');
    var th = $('th'); th.scrollTop = th.scrollHeight;
    function go(body) {
      if (PREVIEW) { toast('Preview mode, not sent'); return; }
      post('/portal/' + T + '/msg', body).then(function (j) { if (!j.ok) return toast(j.error || 'Could not send'); P.msgs = j.portal.msgs; $('th').innerHTML = thread(); $('th').scrollTop = 1e6; $('mt').value = ''; }).catch(function () { toast('Could not send. Try again.'); });
    }
    $('ms').onclick = function () { var t = $('mt').value.trim(); if (t) go({ text: t }); };
    $('mf').onchange = function () {
      var f = this.files[0]; if (!f) return;
      var rd = new FileReader(); rd.onload = function () { var im = new Image(); im.onload = function () { var c = document.createElement('canvas'), s = Math.min(1, 1400 / Math.max(im.width, im.height)); c.width = im.width * s; c.height = im.height * s; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); go({ image: c.toDataURL('image/jpeg', .85) }); }; im.src = rd.result; }; rd.readAsDataURL(f);
    };
  }

  /* ---------- alerts: open only for real people, leave with what they had ---------- */
  function markOpen() { if (opened || PREVIEW || !T) return; opened = true; post('/portal/' + T + '/event', { type: 'open' }).catch(function () {}); ['pointerdown', 'keydown', 'scroll', 'touchstart'].forEach(function (e) { removeEventListener(e, markOpen, true); }); }
  ['pointerdown', 'keydown', 'scroll', 'touchstart'].forEach(function (e) { addEventListener(e, markOpen, { capture: true, passive: true }); });
  addEventListener('pagehide', function () {
    if (PREVIEW || !started || sent) return;
    post('/portal/' + T + '/event', { type: 'leave', stepName: { rings: 'the rings', pick: 'their pick (Ring ' + K.ring + ')', favs: 'choosing between favorites', all: 'sending favorites', none: 'the none of these questions' }[view] || view, draft: { mode: K.mode, ring: K.ring, favs: K.favs, why: K.why, build: K.build, notes: K.notes } }, 1).catch(function () {});
  });

  /* ---------- start ---------- */
  function boot() {
    if (!T) { app.innerHTML = '<div class="card center"><h2>This link is missing a piece.</h2><p class="lead">Please open the link from your text again.</p></div>'; return; }
    fetch(API + '/portal/' + T).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.ok) { app.innerHTML = '<div class="card center"><h2>We could not find this portal.</h2><p class="lead">Text us at ' + PHONE_FMT + ' and we will send a fresh link.</p></div>'; return; }
      P = j.portal; load();
      $('dot').classList.toggle('on', !!P.online);
      if (K.pending && !PREVIEW) post('/portal/' + T + '/pick', K.pending).then(function (x) { if (x.ok) { K.pending = null; save(); } }).catch(function () {});
      var picked = P.pick && P.pick.sentAt;
      if (picked) { K.mode = P.pick.mode; K.ring = P.pick.ring || K.ring; sent = true; sentPage(P.pick.mode); }
      else if (started || /[?&]rings=1/.test(location.search)) rings();
      else intro(0);
    }).catch(function () { app.innerHTML = '<div class="card center"><h2>One moment.</h2><p class="lead">We could not connect. Check your signal and refresh.</p></div>'; });
  }
  boot();
})();
