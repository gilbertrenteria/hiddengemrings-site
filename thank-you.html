<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thank You &mdash; Hidden Gem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F6F3EC;--brown:#6B5B4C;--brown-dark:#5C4D40;--ink:#5C534B;--gold:#B99C5F;--white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--cream);color:var(--ink);font-family:'Cormorant Garamond',serif;
    font-size:19px;line-height:1.6;padding:40px 20px;
  }
  .card{max-width:560px;text-align:center;}
  .card img{height:48px;width:auto;margin:0 auto 34px;}
  h1{
    font-size:clamp(34px,6vw,50px);font-weight:500;color:var(--brown-dark);margin:0 0 20px;
  }
  p{margin:0 0 28px;font-size:19px;}
  .btn{
    display:inline-block;font-family:'Jost',sans-serif;text-transform:uppercase;
    letter-spacing:.12em;font-size:13px;font-weight:600;padding:16px 34px;
    background:var(--brown-dark);color:var(--white);border:1px solid var(--brown-dark);
    text-decoration:none;transition:background .25s ease,color .25s ease;
  }
  .btn:hover{background:transparent;color:var(--brown-dark);}
</style>
</head><body>
  <div class="card">
    <img src="logo-brown.png" alt="Hidden Gem">
    <h1>Thank You</h1>
    <p>We've received your message and will personally follow up soon &mdash; by phone, text, or email, whichever you prefer. We can't wait to start creating something beautiful with you.</p>
    <a class="btn" href="/">Back to Home</a>
  </div>
</body></html>
