<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Pick Your Ring | Hidden Gem Engagement Rings</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hg-links.css">
<script src="splash.js" data-tagline="Your Ring Options Are Ready"></script>
<style>
  .rings{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-top:18px}
  .rc{background:#fff;border:1.5px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
  .rc:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(66,53,41,.12)}
  .rc.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(185,156,95,.45),0 14px 34px rgba(66,53,41,.14)}
  .rc .ph{position:relative;background:var(--cream2)}
  .rc .ph img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
  .rc .ph .badge{position:absolute;top:12px;left:12px}
  .rc .num{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:rgba(66,53,41,.85);color:var(--gold);display:grid;place-items:center;font-family:'Newsreader',serif;font-weight:600}
  .rc .bd{padding:16px 18px 18px;display:flex;flex-direction:column;gap:4px;flex:1}
  .rc h3{font-size:1.35rem;margin:0}
  .rc .meta{color:var(--muted);font-size:.92rem;line-height:1.45}
  .rc .pr{font-family:'Newsreader',serif;font-size:1.6rem;color:var(--deep);margin-top:6px}
  .rc .pr small{font-family:'Work Sans',sans-serif;font-size:.78rem;color:var(--muted);display:block}
  .rc .btn{margin-top:12px;min-height:46px}
  .chosen{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center;margin:16px 0}
  .chosen img{width:150px;height:150px;object-fit:cover;border-radius:18px}
  .tabs3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
  .tabs3 .opt{flex-direction:column;gap:4px;min-height:84px;font-size:.92rem}
  .tabs3 .opt img{width:30px;height:30px}
  .sizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
  .sizes .opt{min-height:48px;padding:6px}
  .mm{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .mm input{max-width:180px}
  .mmout{font-family:'Newsreader',serif;font-size:1.5rem;color:var(--deep)}
  .specs{width:100%;border-collapse:collapse;font-size:1rem}
  .specs td{padding:10px 4px;border-bottom:1px solid var(--line);vertical-align:top}
  .specs td:first-child{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;width:36%;padding-top:13px}
  .specs tr.total td:last-child{font-family:'Newsreader',serif;font-size:1.6rem;color:var(--deep)}
  .agree{display:flex;gap:12px;align-items:flex-start;margin:20px 0 4px;cursor:pointer;line-height:1.5}
  .agree input{width:24px;height:24px;flex:0 0 24px;margin-top:2px;accent-color:var(--brown)}
  .sig{font-family:'Newsreader',serif;font-style:italic;font-size:1.4rem}
  .plans{display:grid;gap:12px;margin-top:16px}
  .plan{position:relative;display:flex;gap:16px;align-items:center;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:18px;cursor:pointer;font:inherit;color:inherit;transition:all .2s ease}
  .plan:hover{border-color:var(--gold)}
  .plan.on{border-color:var(--deep);box-shadow:0 0 0 2px var(--deep)}
  .plan .ic{flex:none;width:54px;height:54px;border-radius:14px;background:var(--goldsoft);display:grid;place-items:center}
  .plan .ic img{width:36px;height:36px}
  .plan b{font-family:'Newsreader',serif;font-size:1.25rem;color:var(--deep);display:block}
  .plan small{color:var(--muted);font-size:.9rem;display:block;line-height:1.4}
  .plan .amt{margin-left:auto;font-family:'Newsreader',serif;font-size:1.35rem;color:var(--deep);white-space:nowrap}
  .plan .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--taupe)}
  .plan.on .dot{border:7px solid var(--deep)}
  .plan.feat::before{content:'Most popular';position:absolute;top:-11px;left:18px;background:var(--gold);color:#2b2119;font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
  .done{text-align:center;padding:10px 0}
  .done .badge{font-size:.8rem;padding:8px 14px}
  .msg{text-align:center;font-size:1.2rem;padding:60px 10px}
  @media(max-width:600px){.chosen{grid-template-columns:96px 1fr}.chosen img{width:96px;height:96px}.plan{flex-wrap:wrap}.plan .amt{margin-left:70px}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <img src="logo-brown.png" alt="Hidden Gem">
      <div class="who"><b>Pick Your Ring</b>Private link</div>
      <nav class="seg" aria-label="Steps">
        <button type="button" data-step="0">Pick</button>
        <button type="button" data-step="1">Size</button>
        <button type="button" data-step="2">Approve</button>
        <button type="button" data-step="3">Pay</button>
      </nav>
    </div>
    <div class="meta"><span id="plab"></span><span id="pcnt"></span></div>
    <div class="prog"><i></i></div>
  </div>
</header>

<main class="wrap" id="app"><p class="msg" id="loading">Loading your rings...</p></main>
<footer class="wrap"><div class="foot"><span>Questions? Call or text <a href="tel:+18327437657">(832) 743-7657</a></span><span><a href="policies.html">Our policies</a> · <a href="mailto:hello@hiddengemrings.com">hello@hiddengemrings.com</a></span></div></footer>

<script src="hg-links.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var id = (q.get('id') || '').replace(/[^a-z0-9]/g, '');
  var app = document.getElementById('app');
  var E = HG.esc, API = HG.API;
  var STORE = 'hgPick:' + id;
  var st = {}; try { st = JSON.parse(localStorage.getItem(STORE) || '{}'); } catch (e) {}
  function save() { try { localStorage.setItem(STORE, JSON.stringify(st)); } catch (e) {} }
  var o = null, step = 0;
  var LABELS = ['Choose your ring', 'Her ring size', 'Review and approve', 'Choose how to pay'];

  if (!id) { app.innerHTML = '<p class="msg">This link is missing its order number. Please use the link we texted you.</p>'; return; }

  function load(tries) {
    fetch(API + '/order/' + id).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.ok || !j.order.options) { app.innerHTML = '<p class="msg">We could not find your ring options. Please call or text (832) 743-7657.</p>'; return; }
      o = j.order;
      if (o.chosen != null && st.pick == null) st.pick = o.chosen;
      if (!tries) fetch(API + '/order/' + id + '/seen', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}', keepalive: true }).catch(function () {});
      step = o.approved ? 3 : (st.step || 0);
      if (step > 0 && st.pick == null) step = 0;
      if (step > 1 && !st.size) step = 1;
      render();
    }).catch(function () {
      if (tries < 4) setTimeout(function () { load(tries + 1); }, 1500 * (tries + 1));
      else app.innerHTML = '<p class="msg">We could not load your rings. Check your connection and refresh, or call (832) 743-7657.</p>';
    });
  }

  function setStep(n) {
    if (o.approved && n < 3) n = 3;
    if (n >= 1 && st.pick == null) n = 0;
    if (n >= 2 && !st.size) n = 1;
    step = n; st.step = n; save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  document.querySelectorAll('.seg button[data-step]').forEach(function (b) { b.addEventListener('click', function () { setStep(Number(b.dataset.step)); }); });

  function chrome() {
    document.querySelector('.prog i').style.width = ((step + 1) / 4 * 100) + '%';
    document.getElementById('plab').textContent = LABELS[step];
    document.getElementById('pcnt').textContent = 'Step ' + (step + 1) + ' of 4';
    document.querySelectorAll('.seg button[data-step]').forEach(function (b) { b.classList.toggle('on', Number(b.dataset.step) === step); });
  }
  function first() { return (o.customerName || '').split(' ')[0]; }
  function img(i) { var x = o.options[i]; return x && x.imageUrl && !x.hasImage ? x.imageUrl : API + '/order/' + o.id + '/image/' + i; }
  function pick() { return o.options[st.pick]; }
  var trust = '<div class="trust"><span><img src="icon-diamond.png" alt="">Certified diamonds</span><span><img src="icon-warranty.png" alt="">One year warranty</span><span><img src="icon-resize.png" alt="">Free first resize</span><span><img src="icon-shipping.png" alt="">Insured delivery</span><span><img src="icon-payment.png" alt="">Secure checkout</span></div>';

  function render() {
    chrome();
    var html = '';
    if (step === 0) html = pagePick();
    if (step === 1) html = pageSize();
    if (step === 2) html = pageReview();
    if (step === 3) html = pagePay();
    app.innerHTML = '<section class="pg on">' + html + '</section>';
    if (step === 0) bindPick();
    if (step === 1) bindSize();
    if (step === 2) bindReview();
    if (step === 3) bindPay();
  }

  /* ---------- Step 1: pick ---------- */
  function pagePick() {
    return '<span class="eyebrow">Your Private Ring Options</span>' +
      '<h1 class="fx" id="h1">' + (first() ? E(first()) + ', ' : '') + 'Your Rings <span class="script">Are Here</span></h1>' +
      '<p class="lead fxlead" id="lead">We chose these rings from everything you told us. Take your time, compare them, and pick the one you can already see on her hand.</p>' +
      (o.brief && o.brief.length ? '<div class="card" style="margin-top:18px"><b style="font-family:Newsreader,serif;font-size:1.15rem;color:var(--deep)">Built from what you told us</b><div class="opts" style="margin-top:10px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))">' + o.brief.map(function (b) { return '<div style="background:var(--cream);border-radius:12px;padding:10px 12px"><span class="fine" style="display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase">' + E(b[0]) + '</span><b style="color:var(--deep)">' + E(b[1]) + '</b></div>'; }).join('') + '</div></div>' : '') +
      trust +
      '<div class="rings stag">' + o.options.map(function (x) {
        return '<div class="rc' + (st.pick === x.i ? ' sel' : '') + '" data-i="' + x.i + '"><div class="ph">' +
          ((x.hasImage || x.imageUrl) ? '<img src="' + img(x.i) + '" alt="' + E(x.name) + '" loading="lazy">' : '<img src="design-penelope-yellow.jpg" alt="">') +
          (x.ready ? '<span class="badge ok">Ready to ship</span>' : '<span class="badge">Made to order</span>') +
          '<span class="num">' + (x.i + 1) + '</span></div><div class="bd"><h3>' + E(x.name) + '</h3>' +
          '<div class="meta">' + E(x.metal) + (x.stone ? '<br>' + E(x.stone) : '') + '</div>' +
          '<div class="pr">' + E(x.price) + '<small>' + (x.ready ? 'Ships in 3 to 5 business days' : 'Delivered within 6 weeks') + '</small></div>' +
          '<button class="btn ' + (st.pick === x.i ? 'gold' : '') + '" type="button" data-pick="' + x.i + '">' + (st.pick === x.i ? 'Selected' : 'Choose this ring') + '</button></div></div>';
      }).join('') + '</div>' +
      '<div class="pgnav"><span class="fine">Monthly payments available at checkout.</span><button class="btn" type="button" id="toSize"' + (st.pick == null ? ' disabled' : '') + '>Next: her ring size</button></div>';
  }
  function bindPick() {
    HG.headline(document.getElementById('h1'), document.getElementById('lead'));
    app.querySelectorAll('[data-pick]').forEach(function (b) {
      b.addEventListener('click', function () {
        st.pick = Number(b.dataset.pick);
        if (pick().noResize && st.size && st.size.method === 'estimate') st.size = null;
        save(); setStep(1);
      });
    });
    document.getElementById('toSize').addEventListener('click', function () { setStep(1); });
  }

  /* ---------- Step 2: size ---------- */
  function mmToSize(mm) { var s = (mm - 11.63) / 0.8128; return Math.round(s * 4) / 4; }
  function sizeList(a, b) { var r = []; for (var x = a; x <= b; x += 0.5) r.push(x); return r; }
  function pageSize() {
    var p = pick(), m = (st.size && st.size.method) || (p.noResize ? 'measured' : 'known');
    st.sizeMode = st.sizeMode || m;
    return '<span class="eyebrow">Her Ring Size</span><h2>Let\'s Get Her <span class="script">Size Right</span></h2>' +
      '<p class="lead">Most people don\'t know her exact size, and that\'s completely normal. Choose whichever way is easiest.' +
      (p.noResize ? '' : ' Your first resize is free within one year, up to two sizes.') + '</p>' +
      (p.noResize ? '<div class="card" style="margin-top:12px"><b>' + E(p.name) + ' can\'t be resized</b><p class="fine" style="margin:4px 0 0">Rings with diamonds all the way around need her exact size, so please use her known size or measure a ring she already wears.</p></div>' : '') +
      '<div class="tabs3">' +
      '<button class="opt' + (st.sizeMode === 'known' ? ' on' : '') + '" type="button" data-mode="known"><img src="icon-ringsize.png" alt="">I know her size</button>' +
      '<button class="opt' + (st.sizeMode === 'measured' ? ' on' : '') + '" type="button" data-mode="measured"><img src="icon-search.png" alt="">Measure her ring</button>' +
      (p.noResize ? '' : '<button class="opt' + (st.sizeMode === 'estimate' ? ' on' : '') + '" type="button" data-mode="estimate"><img src="icon-inspiration.png" alt="">Help me estimate</button>') +
      '</div><div class="card" id="sizeBox"></div>' +
      '<div class="pgnav"><button class="btn ghost" type="button" id="back0">Back</button><button class="btn" type="button" id="toReview" disabled>Next: review</button></div>';
  }
  function bindSize() {
    var box = document.getElementById('sizeBox'), next = document.getElementById('toReview');
    var draft = st.size ? JSON.parse(JSON.stringify(st.size)) : {};
    function ok() { next.disabled = !(draft.size && draft.method === st.sizeMode && (draft.method !== 'estimate' || draft.detail)); }
    function chips(list, cur) { return '<div class="sizes">' + list.map(function (v) { return '<button class="opt' + (cur === v ? ' on' : '') + '" type="button" data-size="' + v + '">' + v + '</button>'; }).join('') + '</div>'; }
    function draw() {
      var m = st.sizeMode;
      if (draft.method !== m) draft = { method: m };
      if (m === 'known') box.innerHTML = '<h3>Her ring size</h3><p class="fine">US sizes. Most women wear between 5 and 7.</p>' + chips(sizeList(3, 10), draft.size);
      if (m === 'measured') box.innerHTML = '<h3>Measure a ring she already wears</h3><p class="fine">Borrow a ring she wears on her ring finger. Lay it on a ruler and measure straight across the inside, edge to edge, in millimeters.</p>' +
        '<div class="mm"><input type="number" inputmode="decimal" step="0.1" min="13" max="23" id="mm" placeholder="16.5" value="' + (draft.mm || '') + '"><span>mm</span><span class="mmout" id="mmout">' + (draft.size ? 'Size ' + draft.size : '') + '</span></div>' +
        '<label class="f"><span>Optional: photo of her ring next to a ruler or coin</span><input type="file" accept="image/*" id="sizePhoto"></label><p class="fine" id="photoNote">' + (st.photo ? 'Photo added. We\'ll double check the size before we start.' : 'We\'ll double check the size from your photo before we start.') + '</p>';
      if (m === 'estimate') box.innerHTML = '<h3>How are you estimating?</h3><div class="opts" style="margin:10px 0 16px">' +
        ['Asked her friend or family', 'Borrowed a ring and compared', 'Compared to my own finger', 'Best guess'].map(function (t) { return '<button class="opt' + (draft.detail === t ? ' on' : '') + '" type="button" data-how="' + t + '">' + t + '</button>'; }).join('') +
        '</div><h3>Your best estimate</h3><p class="fine">Most women wear 5 to 7, and 6 is the most common. Your estimate should be within two sizes, and your first resize is free.</p>' + chips(sizeList(4, 9), draft.size);
      box.querySelectorAll('[data-size]').forEach(function (b) { b.addEventListener('click', function () { draft.size = Number(b.dataset.size); draw(); }); });
      box.querySelectorAll('[data-how]').forEach(function (b) { b.addEventListener('click', function () { draft.detail = b.dataset.how; draw(); }); });
      var mm = document.getElementById('mm');
      if (mm) mm.addEventListener('input', function () {
        var v = Number(mm.value), s = mmToSize(v);
        if (v >= 13 && v <= 23 && s >= 3 && s <= 13) { draft.size = s; draft.mm = v; draft.detail = v + ' mm inside'; document.getElementById('mmout').textContent = 'Size ' + s; }
        else { draft.size = null; document.getElementById('mmout').textContent = v ? 'Check the measurement' : ''; }
        ok();
      });
      var ph = document.getElementById('sizePhoto');
      if (ph) ph.addEventListener('change', function (e) {
        var f = e.target.files[0]; if (!f) return;
        var im = new Image(), u = URL.createObjectURL(f);
        im.onload = function () {
          var mx = 1400, s = Math.min(1, mx / Math.max(im.naturalWidth, im.naturalHeight));
          var c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s);
          c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
          st.photo = c.toDataURL('image/jpeg', 0.85); save();
          document.getElementById('photoNote').textContent = 'Photo added. We\'ll double check the size before we start.';
        };
        im.src = u;
      });
      ok();
    }
    app.querySelectorAll('[data-mode]').forEach(function (b) { b.addEventListener('click', function () { st.sizeMode = b.dataset.mode; save(); app.querySelectorAll('[data-mode]').forEach(function (x) { x.classList.toggle('on', x === b); }); draw(); }); });
    document.getElementById('back0').addEventListener('click', function () { setStep(0); });
    next.addEventListener('click', function () { st.size = draft; save(); setStep(2); });
    draw();
  }

  /* ---------- Step 3: review + sign ---------- */
  function sizeText() { var s = st.size; if (!s) return ''; return s.size + (s.method === 'known' ? '' : s.method === 'measured' ? ' (measured)' : ' (estimated)'); }
  function pageReview() {
    var p = pick();
    return '<span class="eyebrow">Review and Approve</span><h2>Your Ring, <span class="script">Exactly</span></h2>' +
      '<p class="lead">Look over every detail. Once you approve, we start making it just for you.</p>' +
      '<div class="card" style="margin-top:14px"><div class="chosen">' + ((p.hasImage || p.imageUrl) ? '<img src="' + img(p.i) + '" alt="">' : '<span></span>') +
      '<div><h3>' + E(p.name) + '</h3><div class="fine">' + E(p.metal) + '</div></div></div>' +
      '<table class="specs"><tr><td>Metal</td><td>' + E(p.metal) + '</td></tr>' + (p.stone ? '<tr><td>Stone</td><td>' + E(p.stone) + '</td></tr>' : '') +
      '<tr><td>Ring size</td><td>' + E(sizeText()) + (st.size.method !== 'known' && !p.noResize ? '<br><span class="fine">First resize free within one year, up to two sizes</span>' : '') + '</td></tr>' +
      (o.engraving ? '<tr><td>Engraving</td><td>' + E(o.engraving) + '</td></tr>' : '') +
      '<tr><td>Delivery</td><td>' + (p.ready ? 'Ships within 3 to 5 business days after payment' : 'Within 6 weeks of approval and payment') + '</td></tr>' +
      '<tr class="total"><td>Price</td><td>' + E(p.price) + '</td></tr></table>' +
      '<label class="agree"><input type="checkbox" id="agree"><span>I approve this ring, metal, stone, size and price. I understand it\'s made just for me and is <strong>final sale once approved</strong>, as described in the <a href="policies.html" target="_blank">Hidden Gem Policies</a>.</span></label>' +
      '<label class="f"><span>Type your full name to sign</span><input type="text" class="sig" id="sig" autocomplete="name" maxlength="120" placeholder="' + E(o.customerName) + '"></label>' +
      '<p class="status" id="rs" role="status" aria-live="polite"></p></div>' +
      '<div class="pgnav"><button class="btn ghost" type="button" id="back1">Back</button><button class="btn" type="button" id="approve" disabled>Approve my ring</button></div>';
  }
  function bindReview() {
    var agree = document.getElementById('agree'), sig = document.getElementById('sig'), btn = document.getElementById('approve'), rs = document.getElementById('rs');
    function ck() { btn.disabled = !(agree.checked && sig.value.trim().length >= 3); }
    agree.addEventListener('change', ck); sig.addEventListener('input', ck);
    document.getElementById('back1').addEventListener('click', function () { setStep(1); });
    btn.addEventListener('click', function () {
      btn.disabled = true; rs.className = 'status'; rs.textContent = 'Saving your approval...';
      var body = { index: st.pick, size: st.size.size, sizeMethod: st.size.method, sizeDetail: st.size.detail || '', sizePhoto: st.photo || '' };
      post('/order/' + o.id + '/choose', body).then(function (j) {
        if (!j.ok) throw j;
        return post('/order/' + o.id + '/approve', { name: sig.value.trim(), agree: true });
      }).then(function (j) {
        if (!j.ok && !j.saved) throw j;
        o = j.order || o; o.approved = true; st.photo = null; save(); setStep(3);
      }).catch(function (e) { rs.className = 'status err'; rs.textContent = (e && e.error) || 'We could not save yet. Please try again or call (832) 743-7657.'; ck(); });
    });
  }
  function post(path, body) {
    return fetch(API + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(function (r) { return r.json(); });
  }

  /* ---------- Step 4: pay ---------- */
  function prefPlan() { var p = (o.payPref || '').toLowerCase(); return p.indexOf('deposit') > -1 ? 'deposit' : p.indexOf('full') > -1 ? 'full' : 'finance'; }
  function pagePay() {
    var total = HG.cents(o.price), dep = Math.round(total / 2), paid = o.amountPaidCents || 0;
    if (o.paidInFull) return '<div class="done"><span class="badge ok">Paid in full</span><h2 style="margin-top:14px">Thank You, <span class="script">' + E(first()) + '</span></h2><p class="lead" style="margin:10px auto">Your ring is officially in the works. We\'ll text you progress updates and a video of your finished ring before it ships.</p>' + trust + '</div>';
    if (o.paid) return '<div class="done"><span class="badge ok">Deposit paid</span><h2 style="margin-top:14px">Your Ring Is <span class="script">In the Works</span></h2><p class="lead" style="margin:10px auto">We received ' + HG.money(paid) + '. The remaining ' + HG.money(total - paid) + ' is due before your ring ships. Pay it any time below.</p>' +
      '<button class="btn" type="button" id="payBal">Pay remaining ' + HG.money(total - paid) + '</button><p class="status" id="ps" role="status"></p>' + trust + '</div>';
    st.plan = st.plan || prefPlan();
    function plan(k, title, sub, amt, icon, feat) {
      return '<button class="plan' + (feat ? ' feat' : '') + (st.plan === k ? ' on' : '') + '" type="button" data-plan="' + k + '"><span class="dot"></span><span class="ic"><img src="' + icon + '" alt=""></span><span><b>' + title + '</b><small>' + sub + '</small></span><span class="amt">' + amt + '</span></button>';
    }
    return '<span class="badge ok">Approved</span><h2 style="margin-top:12px">How Would You Like <span class="script">to Pay?</span></h2>' +
      '<p class="lead">' + E(o.ring) + ' · ' + E(o.price) + '. Choose the option that fits you best.</p>' +
      '<div class="plans stag">' +
      plan('finance', 'Monthly payments', 'Split it into monthly payments with our lending partners. Apply on your phone in minutes, subject to approval.', HG.money(total), 'icon-financing.png', true) +
      plan('full', 'Pay in full', 'Card, Apple Pay or Cash App.', HG.money(total), 'icon-payment.png') +
      plan('deposit', '50% deposit', 'Start your ring today. The rest is due before it ships.', HG.money(dep), 'icon-pricing.png') +
      '</div><button class="btn wide" type="button" id="pay" style="margin-top:20px">Continue to secure checkout</button>' +
      '<p class="status" id="ps" role="status" aria-live="polite"></p>' +
      '<p class="fine">Checkout is handled by Stripe. Hidden Gem never asks for your Social Security number, income or bank details. Financing is offered by our lending partners and subject to their approval.</p>' + trust;
  }
  function bindPay() {
    var ps = document.getElementById('ps');
    app.querySelectorAll('[data-plan]').forEach(function (b) { b.addEventListener('click', function () { st.plan = b.dataset.plan; save(); app.querySelectorAll('[data-plan]').forEach(function (x) { x.classList.toggle('on', x === b); }); }); });
    function go(plan, btn) {
      btn.disabled = true; ps.className = 'status'; ps.textContent = 'Opening secure checkout...';
      post('/order/' + o.id + '/checkout', { plan: plan }).then(function (j) {
        if (j.ok && j.url) { location.href = j.url; return; }
        if (j.ok && j.alreadyPaid) { location.reload(); return; }
        ps.className = 'status err'; ps.textContent = j.error || 'Could not open checkout. Please call (832) 743-7657.'; btn.disabled = false;
      }).catch(function () { ps.className = 'status err'; ps.textContent = 'Could not open checkout. Please call (832) 743-7657.'; btn.disabled = false; });
    }
    var pay = document.getElementById('pay'); if (pay) pay.addEventListener('click', function () { go(st.plan || 'finance', pay); });
    var bal = document.getElementById('payBal'); if (bal) bal.addEventListener('click', function () { go('balance', bal); });
    if (q.get('paid') === '1' && !o.paid) {
      var n = 0; (function poll() { if (++n > 8) return; setTimeout(function () { fetch(API + '/order/' + o.id).then(function (r) { return r.json(); }).then(function (j) { if (j.ok && j.order.paid) { o = j.order; render(); } else poll(); }).catch(poll); }, 1500); })();
      ps.className = 'status'; ps.textContent = 'Confirming your payment...';
    }
  }

  load(0);
})();
</script>
<script src="track.js" defer></script>
</body>
</html>
